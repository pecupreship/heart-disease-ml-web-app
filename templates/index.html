<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Heart Disease Detection System</title>

  <style>

    body {
      margin: 0;
      padding: 40px;
      background-color: #b7f7a7;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HEADER */

    .header {
      width: 100%;
      max-width: 900px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 20px;
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* HEART LOGO */

    .heart-logo {
      width: 75px;
      height: 75px;

      border-radius: 50%;
      object-fit: cover;

      border: 3px solid darkred;

      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    /* TITLE */

    .page-title {
      font-size: 32px;
      font-weight: bold;
      color: darkred;
    }

    /* MENU */

    .menu a {
      text-decoration: none;

      background-color: darkred;
      color: white;

      padding: 12px 18px;

      border-radius: 8px;

      font-weight: bold;

      transition: 0.3s;
    }

    .menu a:hover {
      background-color: red;
    }

    /* FORM */

    form {
      background-color: #ff5100;
      padding: 20px;
      border-radius: 10px;
      color: white;

      max-width: 850px;
      width: 100%;

      margin: 10px 0;

      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-grid p {
      margin: 0;
    }

    input,
    button {

      width: 100%;

      padding: 12px;

      border: none;

      border-radius: 5px;

      box-sizing: border-box;
    }

    button {

      background-color: white;
      color: red;

      font-weight: bold;

      cursor: pointer;

      margin-top: 15px;

      transition: 0.3s;
    }

    button:hover {
      background-color: #ffe4d6;
    }

    .result {

      text-align: center;

      font-size: 1.2em;

      margin-top: 20px;

      color: #333;

      font-weight: bold;
    }

  </style>

</head>

<body>

  <!-- HEADER -->

  <div class="header">

    <div class="logo-title">

      <!-- HEART LOGO -->

      <img
        src="{{ url_for('static', filename='logo/heart.jpg') }}"
        alt="Heart Logo"
        class="heart-logo">

      <!-- TITLE -->

      <div class="page-title">
        Heart Disease Detection System
      </div>

    </div>

    <!-- ADMIN MENU -->

    <div class="menu">
      <a href="/login">Enter New Heart Data</a>
    </div>

  </div>

  <!-- PREDICTION FORM -->

  <form action="/predict" method="post">

    <h2>Predict Heart Disease</h2>

    <div class="form-grid">

      <p><input name="age" placeholder="Age"></p>

      <p><input name="sex"
      placeholder="Sex (1=Male, 0=Female)"></p>

      <p><input name="cp"
      placeholder="Chest Pain Type (0-3)"></p>

      <p><input name="trestbps"
      placeholder="Resting Blood Pressure"></p>

      <p><input name="chol"
      placeholder="Cholesterol"></p>

      <p><input name="fbs"
      placeholder="Fasting Blood Sugar (1/0)"></p>

      <p><input name="restecg"
      placeholder="Resting ECG (0-2)"></p>

      <p><input name="thalach"
      placeholder="Max Heart Rate"></p>

      <p><input name="exang"
      placeholder="Exercise Induced Angina (1/0)"></p>

      <p><input name="oldpeak"
      placeholder="Oldpeak (e.g., 1.4)"></p>

      <p><input name="slope"
      placeholder="Slope (0-2)"></p>

      <p><input name="ca"
      placeholder="Number of Major Vessels (0-3)"></p>

      <p><input name="thal"
      placeholder="Thal (1=Normal, 2=Fixed, 3=Reversible)"></p>

    </div>

    <button type="submit">
      Predict
    </button>

  </form>

  <!-- RESULT -->

  {% if prediction_text %}

    <div class="result">
      {{ prediction_text }}
    </div>

  {% endif %}

</body>
</html>
