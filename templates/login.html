<!DOCTYPE html>
<html>
<head>

  <title>Admin Login</title>

  <style>

    body{
      font-family:Arial, sans-serif;
      background:#b7f7a7;

      display:flex;
      justify-content:center;
      align-items:center;

      height:100vh;
    }

    .login-box{
      background:#ff5100;

      padding:30px;

      border-radius:10px;

      width:350px;

      color:white;

      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
    }

    input{
      width:100%;

      padding:12px;

      margin-top:15px;

      border:none;

      border-radius:5px;

      box-sizing:border-box;
    }

    button{
      width:100%;

      padding:12px;

      margin-top:20px;

      border:none;

      border-radius:5px;

      background:white;

      color:red;

      font-weight:bold;

      cursor:pointer;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <h2>Admin Login</h2>

    <form method="POST">

      <input type="text"
      name="username"
      placeholder="Username"
      required>

      <input type="password"
      name="password"
      placeholder="Password"
      required>

      <button type="submit">
        Login
      </button>

    </form>

  </div>

</body>
</html>
